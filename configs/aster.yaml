name: aster
seed: 20261120
runs_dir: runs
assets:
  dir: data/assets
  backgrounds: 15000
synth:
  out_size: 224
  canvas: 448
  cjk_ratio: 0.5
  max_extent: 0.45
  light_surface: 0.2
  modes:
    normal: 0.52
    out_of_frame: 0.2
    fill: 0.06
    negative: 0.1
    near_fill: 0.12
  near_fill_light: 0.6
  light_contact_shadow: 0.35
data:
  dir: data/datasets
  mode: rotating
  train_images: 48000
  val_images: 2000
