  freeze_backbone_fraction: 0.08
  threads: 2
  log_every: 100
eval:
  max_missing: 0.01
  max_extra: 0.03
  severe_missing: 0.05
  severe_extra: 0.25
loss:
  sigma_bins: 2.0
  w_kl: 1.0
  w_l1: 20.0
  w_score: 0.5
